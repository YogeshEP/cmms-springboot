# ==============================
# Server
# ==============================
server.port=8080

# ==============================
# PostgreSQL Datasource
# ==============================
spring.datasource.url=jdbc:postgresql://localhost:5432/cmms_db
spring.datasource.username=postgres
spring.datasource.password=Target@DevOps
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true

# ==============================
# Jackson
# ==============================
spring.jackson.serialization.write-dates-as-timestamps=false

# ==============================
# Logging
# ==============================
logging.level.com.cmms=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ==============================
# JWT
# ==============================
# CHANGE THIS SECRET FOR PRODUCTION - must be at least 256 bits (32+ chars) for HS256
jwt.secret=cmms-super-secret-key-change-this-in-production-env-1234567890
jwt.expiration-ms=86400000

# ==============================
# Data Seeder
# ==============================
# Set to false after first run if you don't want data re-seeded on every restart
cmms.seed.enabled=true

# ==============================
# Health
# ==============================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Prometheus Monitoring
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true
